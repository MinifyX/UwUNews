[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
repository = "https://github.com/MinifyX/UwUNews"
rust-version = "1.89"

[workspace.dependencies]
uwunews-feed = { path = "crates/uwunews-feed" }
uwunews-proto = { path = "crates/uwunews-proto" }
uwunews-store = { path = "crates/uwunews-store" }
uwunews-sync = { path = "crates/uwunews-sync" }
uwunews-vault = { path = "crates/uwunews-vault" }
# UwULock's crypto for signing in to a UwULock Server: Bitwarden's master key
# and password hash, the user key, the extras key and the space key under it.
# The same commit UwURDP pins.
uwulock-core = { git = "https://github.com/MinifyX/UwULock-Client", rev = "44078ce82916ae4d7baa84dc2a87deafa71dd38c" }

anyhow = "1"
base64 = "0.22"
parking_lot = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tracing = "0.1"
uuid = { version = "1", features = ["v4", "v7", "serde"] }
rusqlite = { version = "0.40", features = ["bundled"] }
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "rustls-no-provider", "gzip"] }
rustls = { version = "0.23.45", default-features = false, features = ["ring", "std", "logging", "tls12"] }
webpki-roots = "1.0.9"
uniffi = "0.32"

argon2 = { version = "0.5", features = ["zeroize"] }
chacha20poly1305 = "0.10"
rand = "0.8"
sha2 = "0.11"
zeroize = { version = "1", features = ["derive"] }

[profile.dev]
opt-level = 1
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 3
debug = false

[profile.release]
lto = "thin"
opt-level = 3
strip = true

# The library the iOS app links: small, panics stay inside one call.
[profile.ffi-release]
inherits = "release"
lto = "fat"
codegen-units = 1
opt-level = "s"
